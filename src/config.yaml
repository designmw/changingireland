# ─────────────────────────────────────────────────────────────────────────────
# This file holds site/SEO settings. The client's IDENTITY (name, contact,
# address, schema type) lives in src/config/business.ts — the single source of
# truth that feeds schema, the footer, and the contact form.
#
# Easiest way to fill both in: run `npm run setup` (one questionnaire writes
# this file, business.ts, the brand colour, and the Worker name). Before launch
# run `npm run check:golive` to catch any leftover placeholders.
# ─────────────────────────────────────────────────────────────────────────────
site:
  name: Changing Ireland
  site: 'https://changingireland.ie'
  base: '/'
  trailingSlash: false
  # Google Search Console verification. Paste ONLY the token from the
  # "HTML tag" method (the content="..." value), not the whole meta tag.
  # Renders <meta name="google-site-verification"> in <head>. Leave '' if
  # verifying by DNS or by submitting the sitemap instead.
  googleSiteVerificationId: 'Uka_OjhlEV2BIKaGbmVVwCVJcsEEuC6-pFysTPULVFY'

# Default SEO metadata
metadata:
  title:
    default: Changing Ireland — community development news from Ireland
    template: '%s — Changing Ireland'
  description: 'Changing Ireland is the national community development magazine: news, features and voices from communities all around Ireland, free to read.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Changing Ireland
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en-IE
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        # 1,761 tags, 1,144 of them on a single article — indexing them would
        # bury the real pages under thin, near-duplicate archives.
        index: false # intentional: thin tag archives stay out of the index

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: "G-RY1GVWT8MP"
      # Google Analytics loads under Consent Mode v2: analytics/ads storage is
      # DENIED until the visitor accepts via the cookie banner. Setting an `id`
      # above is what makes the cookie banner appear.
      partytown: false

ui:
  # Client sites are light-only by default: no theme toggle in the nav, and the
  # visitor's OS dark-mode preference is ignored. To offer dark mode on a build,
  # set this to 'system' and add `showToggleTheme` back to the Header in
  # src/layouts/PageLayout.astro.
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
